<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Logger Test UI</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1217;
      --panel: #151c24;
      --panel-2: #1b2530;
      --text: #ecf2f7;
      --muted: #99a8b7;
      --line: #2a3643;
      --accent: #2f7cff;
      --accent-pressed: #1f5ed0;
      --active: #42ff8c;
      --inactive: #5d6774;
      --error: #ff7d7d;
      --shadow: rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    main {
      max-width: 1040px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }

    h1, h2 {
      margin: 0 0 10px;
      font-weight: 600;
      letter-spacing: 0;
    }

    h1 {
      font-size: 28px;
    }

    h2 {
      font-size: 18px;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 10px 24px var(--shadow);
    }

    .intro {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: end;
      flex-wrap: wrap;
    }

    .service-status {
      font-size: 14px;
      color: var(--muted);
      white-space: nowrap;
    }

    .recording-row {
      display: grid;
      grid-template-columns: minmax(220px, 360px) auto;
      gap: 12px;
      align-items: end;
    }

    .recording-controls {
      display: inline-flex;
      gap: 10px;
      align-items: center;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    .field label {
      color: var(--muted);
      font-size: 14px;
    }

    input {
      width: 100%;
      min-width: 0;
      font: inherit;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #0f151b;
      color: var(--text);
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .control-button {
      width: 46px;
      height: 46px;
      padding: 0;
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: var(--accent);
      color: #ffffff;
      font: inherit;
      cursor: pointer;
      transition: transform 0.08s ease, background 0.08s ease, border-color 0.08s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .record-icon,
    .stop-icon {
      display: inline-block;
      flex: 0 0 auto;
    }

    .record-icon {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ff4f4f;
      box-shadow: 0 0 12px rgba(255, 79, 79, 0.28);
    }

    .stop-icon {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      background: currentColor;
    }

    .control-button:hover:enabled {
      background: #418bff;
    }

    .control-button:active:enabled,
    .control-button.is-active {
      background: var(--accent-pressed);
      border-color: var(--accent-pressed);
      transform: translateY(1px);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.24);
    }

    .control-button[disabled] {
      opacity: 0.45;
      cursor: default;
    }

    .stop-button {
      background: transparent;
      border-color: var(--line);
      color: var(--text);
    }

    .stop-button:hover:enabled {
      background: #1c2630;
      border-color: #364353;
    }

    .recording-status-block {
      margin-top: 14px;
      display: grid;
      gap: 6px;
    }

    .record-light-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--muted);
    }

    .record-light {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #432222;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    .record-light.active {
      background: #ff4f4f;
      box-shadow: 0 0 12px rgba(255, 79, 79, 0.6);
      animation: blink 1s steps(1, end) infinite;
    }

    .status-line {
      font-size: 14px;
      color: var(--muted);
    }

    .status-line strong {
      color: var(--text);
      font-weight: 500;
    }

    .result-status {
      margin-top: 12px;
      font-size: 14px;
      color: var(--muted);
      word-break: break-word;
    }

    .error {
      margin-top: 8px;
      font-size: 14px;
      color: var(--error);
    }

    .inputs-layout {
      display: grid;
      grid-template-columns: 132px minmax(0, 1fr);
      column-gap: 10px;
      row-gap: 8px;
      align-items: start;
    }

    .inputs-label {
      color: var(--muted);
      font-size: 14px;
      padding-top: 6px;
    }

    .input-strip {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .input-stack {
      width: 54px;
      display: grid;
      grid-template-rows: 18px 20px;
      justify-items: center;
      row-gap: 5px;
    }

    .indicator {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--inactive);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    .indicator.high {
      background: var(--active);
      box-shadow: 0 0 12px rgba(66, 255, 140, 0.35);
    }

    .input-number {
      font-size: 15px;
      color: var(--muted);
      line-height: 1;
    }

    .pulse-strip {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .pulse-box {
      width: 54px;
      height: 26px;
      padding: 0 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: var(--text);
    }

    .pulse-label {
      color: var(--muted);
      font-size: 14px;
      padding-top: 4px;
    }

    @keyframes blink {
      0%, 49% {
        opacity: 1;
      }
      50%, 100% {
        opacity: 0.3;
      }
    }

    @media (max-width: 720px) {
      .recording-row {
        grid-template-columns: 1fr;
      }

      .inputs-layout {
        grid-template-columns: 1fr;
      }

      .inputs-label,
      .pulse-label {
        padding-top: 0;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="panel">
      <div class="intro">
        <div>
          <h1>Event Logger Test UI</h1>
          <p>This page polls input status every 250 ms and exercises the temporary recording API.</p>
        </div>
        <div class="service-status" id="service-status">Loading status...</div>
      </div>
    </div>

    <div class="panel">
      <h2>Recording</h2>
      <div class="recording-row">
        <div class="field">
          <label for="basename">Basename:</label>
          <input id="basename" type="text" placeholder="events">
        </div>
        <div class="recording-controls">
          <button id="start-button" class="control-button record-button" type="button" title="Record" aria-label="Record">
            <span class="record-icon" aria-hidden="true"></span>
          </button>
          <button id="stop-button" class="control-button stop-button" type="button" title="Stop" aria-label="Stop">
            <span class="stop-icon" aria-hidden="true"></span>
          </button>
        </div>
      </div>
      <div class="recording-status-block">
        <div class="record-light-row">
          <span class="record-light" id="record-light"></span>
          <span id="record-light-label">Recorder idle</span>
        </div>
        <div class="status-line" id="recording-state-line"><strong>Status:</strong> idle</div>
        <div class="status-line" id="filename-line"><strong>Filename:</strong> not recording</div>
        <div class="status-line" id="duration-line"><strong>Duration:</strong> 00:00:00</div>
      </div>
      <div class="error" id="error-status"></div>
    </div>

    <div class="panel">
      <h2>Inputs</h2>
      <div class="inputs-layout">
        <div class="inputs-label">Digital inputs:</div>
        <div class="input-strip" id="input-indicators"></div>
        <div class="pulse-label">Pulses recorded</div>
        <div class="pulse-strip" id="pulse-counts"></div>
      </div>
    </div>
  </main>

  <script>
    let lastRisingCounts = new Map();
    let latestStatus = null;

    function formatDuration(startUtc) {
      if (!startUtc) {
        return "00:00:00";
      }
      const startMs = Date.parse(startUtc);
      if (Number.isNaN(startMs)) {
        return "00:00:00";
      }
      const elapsedSeconds = Math.max(0, Math.floor((Date.now() - startMs) / 1000));
      const hours = String(Math.floor(elapsedSeconds / 3600)).padStart(2, "0");
      const minutes = String(Math.floor((elapsedSeconds % 3600) / 60)).padStart(2, "0");
      const seconds = String(elapsedSeconds % 60).padStart(2, "0");
      return `${hours}:${minutes}:${seconds}`;
    }

    function renderInputs(status) {
      const inputs = status.inputs;
      const baselines = status.active_recording.input_rising_baselines ?? {};
      const recordingActive = status.active_recording.active;
      const indicatorContainer = document.getElementById("input-indicators");
      const pulseContainer = document.getElementById("pulse-counts");
      indicatorContainer.innerHTML = "";
      pulseContainer.innerHTML = "";
      for (const input of inputs) {
        const previousRising = lastRisingCounts.get(input.name) ?? input.rising_count;
        const transientHigh = input.current_level === 0 && input.rising_count > previousRising;
        const displayHigh = input.current_level === 1 || transientHigh;
        lastRisingCounts.set(input.name, input.rising_count);

        const inputNumber = String(input.name).replace(/^DIN/i, "");
        const indicatorStack = document.createElement("div");
        indicatorStack.className = "input-stack";
        indicatorStack.innerHTML = `
          <span class="indicator ${displayHigh ? "high" : ""}" title="${input.name}"></span>
          <span class="input-number">${inputNumber}</span>
        `;
        indicatorContainer.appendChild(indicatorStack);

        const baseline = Number(baselines[input.name] ?? 0);
        const recordingCount = recordingActive ? Math.max(0, Number(input.rising_count) - baseline) : 0;
        const pulseBox = document.createElement("div");
        pulseBox.className = "pulse-box";
        pulseBox.textContent = String(recordingCount);
        pulseContainer.appendChild(pulseBox);
      }
    }

    function renderStatus(status) {
      latestStatus = status;
      const active = status.active_recording.active;
      const startButton = document.getElementById("start-button");
      const stopButton = document.getElementById("stop-button");
      const basenameInput = document.getElementById("basename");
      const recordLight = document.getElementById("record-light");
      const recordLightLabel = document.getElementById("record-light-label");

      document.getElementById("service-status").textContent =
        `capture service: ${status.capture_service_running ? "running" : "not running"} | control service: running`;

      startButton.classList.toggle("is-active", active);
      startButton.disabled = active;
      stopButton.disabled = !active;
      basenameInput.disabled = active;
      recordLight.classList.toggle("active", active);
      recordLightLabel.textContent = active ? "Recording in progress" : "Recorder idle";

      document.getElementById("recording-state-line").innerHTML = active
        ? "<strong>Status:</strong> recording"
        : "<strong>Status:</strong> idle";
      document.getElementById("filename-line").innerHTML = active && status.active_recording.filename
        ? `<strong>Filename:</strong> ${status.active_recording.filename}`
        : "<strong>Filename:</strong> not recording";
      document.getElementById("duration-line").innerHTML = `<strong>Duration:</strong> ${active ? formatDuration(status.active_recording.start_utc) : "00:00:00"}`;

      renderInputs(status);
    }

    async function pollStatus() {
      const response = await fetch("/v1/status");
      const status = await response.json();
      renderStatus(status);
    }

    async function startRecording() {
      document.getElementById("error-status").textContent = "";
      const basename = document.getElementById("basename").value;
      const response = await fetch("/v1/recordings/start", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ basename })
      });
      const payload = await response.json();
      if (!response.ok) {
        document.getElementById("error-status").textContent = payload.error;
        return;
      }
      await pollStatus();
    }

    async function stopRecording() {
      document.getElementById("error-status").textContent = "";
      const response = await fetch("/v1/recordings/stop", { method: "POST" });
      const payload = await response.json();
      if (!response.ok) {
        document.getElementById("error-status").textContent = payload.error;
        return;
      }
      await pollStatus();
    }

    document.getElementById("start-button").addEventListener("click", startRecording);
    document.getElementById("stop-button").addEventListener("click", stopRecording);

    pollStatus().catch((error) => {
      document.getElementById("error-status").textContent = String(error);
    });

    setInterval(() => {
      if (latestStatus) {
        renderStatus(latestStatus);
      }
    }, 250);

    setInterval(() => {
      pollStatus().catch((error) => {
        document.getElementById("error-status").textContent = String(error);
      });
    }, 250);
  </script>
</body>
</html>
