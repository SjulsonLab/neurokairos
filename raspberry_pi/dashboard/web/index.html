<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NeuroKairos</title>
<style>
  :root {
    --good: #16a34a; --marginal: #d97706; --bad: #dc2626;
    --unsynced: #9ca3af; --led: #2563eb; --ink: #111827; --muted: #6b7280;
    --line: #e5e7eb; --bg: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 20px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  header .spacer { flex: 1; }
  header .updated { color: var(--muted); font-size: 12px; }
  button {
    font: inherit; border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 7px; padding: 5px 10px; cursor: pointer;
  }
  button:hover { background: #f9fafb; }
  button.danger { color: var(--bad); border-color: #fecaca; }
  button.primary { background: var(--led); color: #fff; border-color: var(--led); }

  main { padding: 8px 20px 24px; }
  .section-label { font-size: 12px; font-weight: 600; letter-spacing: .06em;
                   text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; align-content: flex-start; }
  section.hidden { display: none; }
  .card {
    position: relative; width: 320px; border: 1px solid var(--line);
    border-radius: 12px; padding: 16px 16px 12px; background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .card.offline { opacity: .55; }
  .led {
    position: absolute; top: 12px; right: 14px; width: 11px; height: 11px;
    border-radius: 50%; background: var(--unsynced);
    border: 1px solid rgba(0,0,0,.12);
  }
  /* IRIG-H output mirror: the dot is a live reflection of the sender's GPIO pin
     — present (blue) while the pin is HIGH, absent while LOW, driven by the
     clock-reconstructed IRIG-H waveform. Like an LED wired to the pin. */
  .led.irig { background: transparent; border-color: transparent; box-shadow: none;
              transition: opacity .04s linear; opacity: 0; }
  .led.irig.on { opacity: 1; background: var(--led); border-color: rgba(0,0,0,.12);
                 box-shadow: 0 0 6px rgba(37,99,235,.6); }

  .name { font-size: 16px; font-weight: 650; margin: 0 22px 2px 0; cursor: text; }
  .name:hover { text-decoration: underline dotted; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .badge {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); vertical-align: middle;
  }
  .quality { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--unsynced); }
  .q-good .dot { background: var(--good); } .q-good { color: var(--good); }
  .q-marginal .dot { background: var(--marginal); } .q-marginal { color: var(--marginal); }
  .q-bad .dot { background: var(--bad); } .q-bad { color: var(--bad); }
  .q-unsynced .dot { background: var(--unsynced); } .q-unsynced { color: var(--unsynced); }

  table.fields { width: 100%; border-collapse: collapse; margin: 8px 0; }
  table.fields td { padding: 2px 0; font-size: 13px; vertical-align: top; }
  table.fields td.k { color: var(--muted); width: 42%; }
  table.fields td.v { text-align: right; font-variant-numeric: tabular-nums; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px;
             border-top: 1px solid var(--line); padding-top: 10px; }
  .actions button { font-size: 12px; padding: 4px 8px; }
  .empty { color: var(--muted); padding: 40px 20px; }

  dialog { border: 1px solid var(--line); border-radius: 12px; padding: 20px; min-width: 280px; }
  dialog h3 { margin: 0 0 12px; font-size: 16px; }
  dialog input { width: 100%; padding: 8px; border: 1px solid var(--line);
                 border-radius: 7px; font: inherit; margin-bottom: 12px; }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; }

  /* Per-sender pulse-anomaly badge: small red square with "!" inside the card,
     just left of the IRIG dot. Click opens the notifications dialog. */
  .notif-badge { position: absolute; top: 10px; right: 34px; width: 18px; height: 18px;
                 background: var(--bad); color: #fff; border-radius: 4px; cursor: pointer;
                 font-size: 12px; font-weight: 800; line-height: 18px; text-align: center; }
  .card.offline .notif-badge { right: 14px; }
  .notif-badge.archived { background: var(--unsynced); }   /* grey: only archived remain */
  #notifList { min-width: 380px; max-height: 60vh; overflow: auto; }
  .alert { display: flex; align-items: center; justify-content: space-between; gap: 12px;
           background: #fef2f2; border: 1px solid #fecaca; color: #991b1b;
           border-radius: 8px; padding: 8px 12px; margin: 8px 0; font-size: 13px; }
  .alert .msg { font-weight: 500; }
  .alert button { border-color: #fecaca; color: #991b1b; }
  .alert button:disabled { opacity: .5; cursor: not-allowed; }
  .alert.archived { background: #f3f4f6; border-color: var(--line); color: var(--muted); }
  .alert.archived .tag { font-size: 11px; color: #9ca3af; text-transform: uppercase; }
</style>
</head>
<body>
<header>
  <h1>NeuroKairos</h1>
  <span class="badge" id="count">—</span>
  <span class="spacer"></span>
  <span class="updated" id="updated"></span>
  <button id="authBtn" onclick="authClick()">…</button>
</header>

<main>
  <div id="loading" class="empty">Searching for NeuroKairos devices…</div>
  <section id="serversSec" class="hidden">
    <div class="section-label">Servers</div><div id="servers" class="row"></div>
  </section>
  <section id="clientsSec" class="hidden">
    <div class="section-label">Senders</div><div id="clients" class="row"></div>
  </section>
</main>

<dialog id="pwDialog">
  <h3 id="pwTitle">Log in</h3>
  <input type="password" id="pwInput" placeholder="Password" autocomplete="current-password">
  <input type="password" id="pwCurrent" placeholder="Current password" style="display:none">
  <div class="row">
    <button onclick="pwDialog.close()">Cancel</button>
    <button class="primary" id="pwOk" onclick="pwSubmit()">OK</button>
  </div>
</dialog>

<dialog id="notifDialog">
  <h3 id="notifTitle">Pulse anomalies</h3>
  <div id="notifList"></div>
  <div class="row"><button onclick="notifDialog.close()">Close</button></div>
</dialog>

<script>
"use strict";
let TOKEN = sessionStorage.getItem("nk_token") || null;
let CONFIGURED = false;

const $ = (id) => document.getElementById(id);
const api = async (path, opts) => {
  const r = await fetch(path, opts);
  let body = {}; try { body = await r.json(); } catch (e) {}
  return { ok: r.ok, status: r.status, body };
};

function fmtSec(s) {
  if (s === null || s === undefined) return "—";
  const us = Math.abs(s) * 1e6;
  if (us < 1000) return us.toFixed(1) + " µs";
  return (us / 1000).toFixed(3) + " ms";
}
function fmt(v, unit) { return (v === null || v === undefined) ? "—" : v + (unit || ""); }

// --- IRIG-H waveform reconstruction (mirrors irig_sender.c) ---------------
// The dashboard can't poll a sub-second GPIO signal, so it rebuilds the exact
// IRIG-H pulse train from the current UTC time (frames align to the minute;
// each of the 60 seconds carries one pulse: 0.2 s = binary 0, 0.5 s = 1,
// 0.8 s = position marker). This matches generate_irig_h_frame()/
// calculate_pulse_length(), including the NeuroKairos status bits (43-44
// stratum, 46-48 root-dispersion bucket).
const IRIG_W = {
  seconds: [1,2,4,8,10,20,40], minutes: [1,2,4,8,10,20,40], hours: [1,2,4,8,10,20],
  doy: [1,2,4,8,10,20,40,80,100,200], decis: [1,2,4,8], years: [1,2,4,8,10,20,40,80],
};
function irigBcd(value, weights) {
  const r = weights.map(() => 0);
  for (let i = weights.length - 1; i >= 0; i--) {
    if (weights[i] <= value) { r[i] = 1; value -= weights[i]; }
  }
  return r;
}
function irigDoy(d) {
  return Math.floor((Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())
                     - Date.UTC(d.getUTCFullYear(), 0, 0)) / 86400000);
}
function irigDispBucket(sec) {
  if (sec == null) return 7;
  const ms = sec * 1000, bounds = [0.25, 0.5, 1, 2, 4, 8, 16];
  for (let i = 0; i < bounds.length; i++) if (ms < bounds[i]) return i;
  return 7;
}
// 60 pulse widths (seconds) for the frame covering `date`'s minute.
function irigWidths(date, stratum, dispSec) {
  const sec = irigBcd(0, IRIG_W.seconds), min = irigBcd(date.getUTCMinutes(), IRIG_W.minutes),
        hr = irigBcd(date.getUTCHours(), IRIG_W.hours), doy = irigBcd(irigDoy(date), IRIG_W.doy),
        dec = irigBcd(0, IRIG_W.decis), yr = irigBcd(date.getUTCFullYear() % 100, IRIG_W.years);
  const b = new Array(60).fill(0); let p = 0;   // 0=ZERO, 1=ONE, 2=marker
  const data = (a, lo, hi) => { for (let i = lo; i < hi; i++) b[p++] = a[i] ? 1 : 0; };
  b[p++] = 2;
  data(sec, 0, 4); b[p++] = 0; data(sec, 4, 7); b[p++] = 2;
  data(min, 0, 4); b[p++] = 0; data(min, 4, 7); b[p++] = 0; b[p++] = 2;
  data(hr, 0, 4); b[p++] = 0; data(hr, 4, 6); b[p++] = 0; b[p++] = 0; b[p++] = 2;
  data(doy, 0, 4); b[p++] = 0; data(doy, 4, 8); b[p++] = 2;
  data(doy, 8, 10); b[p++] = 0; b[p++] = 0; b[p++] = 0; data(dec, 0, 4); b[p++] = 2;
  data(yr, 0, 4); b[p++] = 0; data(yr, 4, 8); b[p++] = 2;
  const s = stratum === 1 ? 0 : stratum === 2 ? 1 : stratum === 3 ? 2 : 3;
  b[43] = (s & 1) ? 1 : 0; b[44] = (s & 2) ? 1 : 0;
  const dsp = irigDispBucket(dispSec);
  b[46] = (dsp & 1) ? 1 : 0; b[47] = (dsp & 2) ? 1 : 0; b[48] = (dsp & 4) ? 1 : 0;
  return b.map(v => v === 2 ? 0.8 : v === 1 ? 0.5 : 0.2);
}
function irigPinHigh(el, nowMs) {
  if (el.dataset.sending !== "1") return false;     // not transmitting -> idle LOW
  const d = new Date(nowMs);
  const widths = irigWidths(d, +el.dataset.stratum || 0,
                            el.dataset.disp === "" ? null : +el.dataset.disp);
  return (d.getUTCMilliseconds() / 1000) < widths[d.getUTCSeconds()];
}
function animateLeds() {
  const now = Date.now();
  document.querySelectorAll(".led.irig").forEach(el =>
    el.classList.toggle("on", irigPinHigh(el, now)));
}

function refreshAuthBtn() {
  if (TOKEN) $("authBtn").textContent = "Log out";
  else if (CONFIGURED) $("authBtn").textContent = "Log in";
  else $("authBtn").textContent = "Set password";
}

function authClick() {
  if (TOKEN) { TOKEN = null; sessionStorage.removeItem("nk_token"); refreshAuthBtn(); return; }
  const setting = !CONFIGURED;
  $("pwTitle").textContent = setting ? "Set dashboard password" : "Log in";
  $("pwInput").value = ""; $("pwCurrent").value = "";
  $("pwCurrent").style.display = "none";
  $("pwDialog").returnValue = ""; $("pwDialog")._mode = setting ? "set" : "login";
  $("pwDialog").showModal(); $("pwInput").focus();
}

async function pwSubmit() {
  const mode = $("pwDialog")._mode;
  const pw = $("pwInput").value;
  if (mode === "set") {
    const r = await api("/api/set-password", { method: "POST",
      body: JSON.stringify({ password: pw }) });
    if (!r.ok) { alert(r.body.error || "Failed"); return; }
    CONFIGURED = true;
  }
  // Always log in to obtain a token.
  const r = await api("/api/login", { method: "POST", body: JSON.stringify({ password: pw }) });
  if (!r.ok) { alert(r.body.error || "Login failed"); return; }
  TOKEN = r.body.token; sessionStorage.setItem("nk_token", TOKEN);
  refreshAuthBtn(); $("pwDialog").close();
}

async function control(ip, port, action, params) {
  if (!TOKEN) { authClick(); return; }
  const r = await api("/api/control", { method: "POST",
    body: JSON.stringify({ token: TOKEN, target: ip, port, action, params: params || {} }) });
  if (r.status === 401) { TOKEN = null; sessionStorage.removeItem("nk_token"); refreshAuthBtn(); authClick(); return; }
  if (!r.ok) { alert(r.body.error || "Action failed"); return; }
  load();
}

function rename(pi) {
  const name = prompt("Rename this device:", pi.name || pi.hostname);
  if (name) control(pi.ip, pi.port, "rename", { name });
}
function setNtp(pi) {
  const server = prompt("NTP server for this device (blank to clear / use discovery):", "");
  if (server !== null) control(pi.ip, pi.port, "set-ntp", { server });
}

function qualityChip(t) {
  const q = (t && t.quality) || "unknown";
  const label = { good: "Good", marginal: "Marginal", bad: "Poor", unsynced: "Unsynced" }[q] || "Unknown";
  return `<span class="quality q-${q}"><span class="dot"></span>${label}</span>`;
}

function card(pi) {
  const t = pi.timing || {};
  const badge = `<div class="notif-badge" style="display:none" onclick="openNotifs('${pi.endpoint || ""}')" title="Pulse anomalies">!</div>`;
  if (!pi.online) {
    return `<div class="card offline" data-endpoint="${pi.endpoint || ""}">${badge}
      <div class="name">${pi.name || pi.ip}</div>
      <div class="sub">${pi.ip} · offline</div></div>`;
  }
  // Blue dot mirrors the sender's IRIG-H output GPIO pin: present while HIGH,
  // absent while LOW. The waveform is reconstructed from the clock by
  // animateLeds() using the data attributes below. Senders only — servers get
  // no dot. If irig-sender isn't running (data-sending=0) the pin is idle LOW,
  // so the dot stays absent.
  const isSender = pi.role !== "server";
  const sending = !!(pi.services && pi.services["irig-sender"]);
  const dot = isSender
    ? `<div class="led irig" data-sending="${sending ? 1 : 0}" data-stratum="${t.stratum || 0}" data-disp="${t.root_dispersion_s == null ? "" : t.root_dispersion_s}" title="IRIG-H output (mirrors the GPIO pin)"></div>`
    : "";
  const cal = pi.calibrator;
  const rows = [
    ["Sync", qualityChip(t)],
    ["Stratum", fmt(t.stratum)],
    ["Reference", (t.reference || "—") + (t.reference_tier && t.reference_tier !== "NONE" ? ` <span class="badge">${t.reference_tier}</span>` : "")],
    ["RMS offset", fmtSec(t.rms_offset_s)],
    ["Root dispersion", fmtSec(t.root_dispersion_s)],
    ["Frequency", t.freq_ppm != null ? t.freq_ppm.toFixed(2) + " ppm" : "—"],
    ["Sources", pi.sources ? (pi.sources.count + (pi.sources.diversity_ok === false ? " ⚠" : "")) : "—"],
  ];
  if (cal && cal.precision_typical_ms != null)
    rows.push(["Precision", cal.precision_typical_ms.toFixed(3) + " ms"]);

  return `<div class="card" data-endpoint="${pi.endpoint || ""}">
    ${dot}
    ${badge}
    <div class="name" title="Click to rename" onclick='rename(${JSON.stringify(pi)})'>${pi.name || pi.hostname}</div>
    <div class="sub">${pi.hostname} · ${pi.ip} <span class="badge">${pi.role}</span></div>
    <table class="fields">${rows.map(([k, v]) => `<tr><td class="k">${k}</td><td class="v">${v}</td></tr>`).join("")}</table>
    <div class="actions">
      <button onclick='control("${pi.ip}",${pi.port},"restart",{service:"chrony"})'>Restart chrony</button>
      <button onclick='control("${pi.ip}",${pi.port},"restart",{service:"irig-sender"})'>Restart sender</button>
      <button onclick='setNtp(${JSON.stringify(pi)})'>Set NTP</button>
      <button onclick='if(confirm("Reboot ${pi.hostname}?"))control("${pi.ip}",${pi.port},"reboot")'>Reboot</button>
      <button class="danger" onclick='if(confirm("Shut down ${pi.hostname}?"))control("${pi.ip}",${pi.port},"shutdown")'>Shutdown</button>
    </div>
  </div>`;
}

function renderSection(secId, listId, items) {
  const sec = $(secId);
  if (!items.length) { sec.classList.add("hidden"); $(listId).innerHTML = ""; return; }
  sec.classList.remove("hidden");
  $(listId).innerHTML = items.map(card).join("");
}

let ALERTS = [];

function alertMsg(a) {
  return a.kind === "stopped"
    ? `IRIG-H pulses stopped (last onset ${a.onset_iso})`
    : `pulse interval ${a.interval_s.toFixed(2)} s (expected 1.00 s) at ${a.onset_iso}`;
}

// Show/hide the red "!" badge on each card based on its endpoint's active alerts.
function syncBadges() {
  const total = {}, active = {};
  ALERTS.forEach(a => {
    total[a.endpoint] = (total[a.endpoint] || 0) + 1;
    if (!a.archived) active[a.endpoint] = (active[a.endpoint] || 0) + 1;
  });
  document.querySelectorAll(".card[data-endpoint]").forEach(el => {
    const badge = el.querySelector(".notif-badge");
    if (!badge) return;
    const t = total[el.dataset.endpoint] || 0, ac = active[el.dataset.endpoint] || 0;
    badge.style.display = t ? "block" : "none";           // hidden only if none at all
    badge.classList.toggle("archived", t > 0 && ac === 0); // grey when only archived remain
    badge.title = ac > 0
      ? `${ac} active pulse ${ac === 1 ? "anomaly" : "anomalies"} — click to view`
      : `${t} archived pulse ${t === 1 ? "anomaly" : "anomalies"} — click to view`;
  });
}

let notifEndpoint = null;   // which sender's notifications the dialog is showing

function renderNotifList() {
  const items = ALERTS.filter(a => a.endpoint === notifEndpoint);
  $("notifTitle").textContent = items.length
    ? `Pulse anomalies — ${items[0].sender_name}` : "Pulse anomalies";
  const list = $("notifList");
  if (!items.length) { list.innerHTML = `<div class="empty">No notifications.</div>`; return; }
  list.innerHTML = items.map(a => {
    if (a.archived) {   // kept for history, greyed, non-urgent, no action
      return `<div class="alert archived"><span class="msg">${alertMsg(a)}</span><span class="tag">archived</span></div>`;
    }
    const btn = TOKEN
      ? `<button onclick="archiveAlert('${a.id}')">Archive</button>`
      : `<button disabled title="Log in to archive">Archive</button>`;
    return `<div class="alert"><span class="msg">⚠ ${alertMsg(a)}</span>${btn}</div>`;
  }).join("");
}

function openNotifs(endpoint) {
  notifEndpoint = endpoint;
  renderNotifList();
  if (!$("notifDialog").open) $("notifDialog").showModal();
}

async function loadAlerts() {
  const r = await api("/api/alerts");
  ALERTS = (r.body && r.body.alerts) || [];
  syncBadges();
  if ($("notifDialog").open) renderNotifList();   // keep an open panel fresh
}
async function archiveAlert(id) {
  if (!TOKEN) { authClick(); return; }
  await api("/api/alerts/archive", { method: "POST",
    body: JSON.stringify({ id, token: TOKEN }) });
  loadAlerts();
}

async function load() {
  const r = await api("/api/all");
  const pis = (r.body && r.body.pis) || [];
  $("count").textContent = pis.length + (pis.length === 1 ? " device" : " devices");
  $("updated").textContent = "updated " + new Date().toLocaleTimeString();
  $("loading").style.display = pis.length ? "none" : "";
  renderSection("serversSec", "servers", pis.filter(p => p.role === "server"));
  renderSection("clientsSec", "clients", pis.filter(p => p.role !== "server"));
  syncBadges();   // freshly-rendered cards start with badges hidden; restore them
}

async function init() {
  const r = await api("/api/auth-status");
  CONFIGURED = !!(r.body && r.body.configured);
  refreshAuthBtn();
  await load();
  await loadAlerts();
  setInterval(load, 2000);
  setInterval(loadAlerts, 750);   // near-instant pulse-anomaly banners
  setInterval(animateLeds, 50);   // mirror each sender's IRIG-H pin in real time
}
init();
</script>
</body>
</html>
