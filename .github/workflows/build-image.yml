name: Build Raspberry Pi OS images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      pi_gen_ref:
        description: 'pi-gen branch or tag to build against'
        required: false
        default: '2026-06-18-raspios-trixie-arm64'

permissions:
  contents: write  # needed by softprops/action-gh-release on tag pushes

jobs:
  build:
    name: Build ${{ matrix.variant }} image
    # Native arm64 runner — eliminates qemu-user emulation entirely. pi-gen's
    # cross-arch builds (x86_64 host → arm64 target) repeatedly hit qemu bugs
    # (CPython SIGSEGV, binfmt failing mid-build, etc.). On a native arm64
    # host none of that machinery is in the path.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: sender
            stage_dir: stage-neurokairos-client
          - variant: server
            stage_dir: stage-neurokairos-server

    env:
      PI_GEN_REF: ${{ inputs.pi_gen_ref || '2026-06-18-raspios-trixie-arm64' }}

    steps:
      - name: Check out neurokairos
        uses: actions/checkout@v4

      - name: Compile irig_sender (native arm64)
        run: |
          # Native compile — no cross toolchain needed on arm64 runner.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential
          install -d build
          gcc -O2 -o build/irig_sender raspberry_pi/sender/irig_sender.c -lpthread -lm
          file build/irig_sender

      - name: Free up disk space on runner
        run: |
          # pi-gen needs ~10-15 GB; the default Ubuntu runner ships with a lot
          # of preinstalled tooling we don't need.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL "/usr/local/share/boost" \
                      "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Clone pi-gen
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$PI_GEN_REF" \
              https://github.com/RPi-Distro/pi-gen.git pi-gen

          # pi-gen sizes the exported .img as du(rootfs) + ROOT_MARGIN, where
          # ROOT_MARGIN is hardcoded to 20% + 200 MB with no config knob. On
          # trixie that headroom is too small: the export-phase apt-get update
          # (arm64 + armhf package lists + source cache) overflows the root
          # partition and fails with ENOSPC. Widen the margin to 50% + 1200 MB.
          margin='ROOT_MARGIN="$(echo "($ROOT_SIZE * 0.5 + 1200 * 1024 * 1024) / 1" | bc)"'
          sed -i "s#^ROOT_MARGIN=.*#${margin}#" pi-gen/export-image/prerun.sh
          echo "--- patched ROOT_MARGIN ---"
          grep -n 'ROOT_MARGIN=' pi-gen/export-image/prerun.sh

      - name: Stage NeuroKairos sources into pi-gen
        run: |
          set -euo pipefail
          # Copy our stages onto the pi-gen tree
          cp -r image/stage-neurokairos-common pi-gen/
          cp -r image/${{ matrix.stage_dir }} pi-gen/

          # Copy the natively-built arm64 binary and the systemd unit into
          # the common stage's files/. raspberry_pi/ is the source of truth in
          # git; pi-gen runs from a copy. We do not ship the .c/Makefile to
          # the image — the image carries only the binary.
          dst=pi-gen/stage-neurokairos-common/00-install-sender/files
          install -m 755 build/irig_sender "$dst/"
          install -m 644 raspberry_pi/systemd/irig-sender.service "$dst/"

          # Stage the NTP calibrator daemon + unit into its install step's
          # files/. Pure-Python, so nothing to compile — just copy from the
          # raspberry_pi/ source of truth.
          cal=pi-gen/stage-neurokairos-common/03-install-calibrator/files
          install -m 644 raspberry_pi/scripts/ntp_calibrator.py "$cal/"
          install -m 644 raspberry_pi/systemd/ntp-calibrator.service "$cal/"

          # Stage the LAN discovery daemon + units into the client stage (only
          # present for the sender variant). Guarded so the server build skips.
          disc=pi-gen/${{ matrix.stage_dir }}/01-install-discovery/files
          if [ -d "$disc" ]; then
            install -m 644 raspberry_pi/scripts/nk_discover_ntp.py "$disc/"
            install -m 644 raspberry_pi/systemd/nk-discover-ntp.service "$disc/"
            install -m 644 raspberry_pi/systemd/nk-discover-ntp.timer "$disc/"
          fi

          # Stage the status agent (both images) into the common stage.
          agent=pi-gen/stage-neurokairos-common/04-install-status-agent/files
          install -m 644 raspberry_pi/scripts/nk_status_agent.py "$agent/"
          install -m 644 raspberry_pi/systemd/nk-status-agent.service "$agent/"

          # Stage the appliance basics (both images) into the common stage.
          app=pi-gen/stage-neurokairos-common/05-appliance/files
          install -m 644 raspberry_pi/scripts/nk_console_issue.sh "$app/"
          install -m 644 raspberry_pi/scripts/nk_sanitize.sh "$app/"
          install -m 644 raspberry_pi/systemd/nk-console-issue.service "$app/"
          install -m 644 raspberry_pi/systemd/nk-console-issue.timer "$app/"

          # Sender-only: stage the neurokairos.local alias publisher.
          appc=pi-gen/${{ matrix.stage_dir }}/02-appliance/files
          if [ -d "$appc" ]; then
            install -m 644 raspberry_pi/scripts/nk_publish_alias.sh "$appc/"
            install -m 644 raspberry_pi/systemd/nk-sender-alias.service "$appc/"
          fi

          # Sender-only: stage headless Wi-Fi onboarding (decision oneshot +
          # setup-hotspot portal + boot-partition example).
          wifi=pi-gen/${{ matrix.stage_dir }}/03-wifi-onboard/files
          if [ -d "$wifi" ]; then
            install -m 644 raspberry_pi/scripts/nk_wifi_onboard.py "$wifi/"
            install -m 644 raspberry_pi/scripts/nk_wifi_portal.py "$wifi/"
            install -m 644 raspberry_pi/scripts/neurokairos-wifi.txt.example "$wifi/"
            install -m 644 raspberry_pi/systemd/nk-wifi-onboard.service "$wifi/"
            install -m 644 raspberry_pi/systemd/nk-wifi-portal.service "$wifi/"
          fi

          # Stage the dashboard (server variant only) into its install step.
          dash=pi-gen/${{ matrix.stage_dir }}/01-install-dashboard/files
          if [ -d "$dash" ]; then
            install -m 644 raspberry_pi/scripts/nk_dashboard.py "$dash/"
            install -m 644 raspberry_pi/scripts/nk_publish_alias.sh "$dash/"
            install -m 644 raspberry_pi/systemd/nk-dashboard.service "$dash/"
            install -m 644 raspberry_pi/systemd/nk-dashboard-alias.service "$dash/"
            install -m 644 raspberry_pi/dashboard/web/index.html "$dash/"
          fi

          # Don't export the vanilla Pi OS Lite image from stage2 — only our
          # variant stage exports.
          rm -f pi-gen/stage2/EXPORT_IMAGE

          # Render pi-gen/config from the template
          sed "s|@VARIANT_STAGE@|${{ matrix.stage_dir }}|" \
              image/config.template > pi-gen/config

          echo "--- pi-gen/config ---"
          cat pi-gen/config

      - name: Build image via pi-gen Docker
        working-directory: pi-gen
        run: |
          set -euo pipefail
          ./build-docker.sh

      - name: Locate and rename artifact
        id: artifact
        run: |
          set -euo pipefail
          shopt -s nullglob
          imgs=(pi-gen/deploy/*.img.xz)
          if [ ${#imgs[@]} -eq 0 ]; then
            echo "::error::No .img.xz produced in pi-gen/deploy/"
            ls -la pi-gen/deploy/ || true
            exit 1
          fi
          src="${imgs[0]}"

          date_tag=$(date -u +%Y-%m-%d)
          short_sha=$(git rev-parse --short HEAD)
          name="neurokairos-${{ matrix.variant }}-${date_tag}-${short_sha}.img.xz"

          mkdir -p out
          mv "$src" "out/$name"
          ( cd out && sha256sum "$name" > "$name.sha256" )

          echo "path=out/$name" >> "$GITHUB_OUTPUT"
          echo "sha_path=out/$name.sha256" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -lh out/

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            ${{ steps.artifact.outputs.path }}
            ${{ steps.artifact.outputs.sha_path }}
          retention-days: 14

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifact.outputs.path }}
            ${{ steps.artifact.outputs.sha_path }}
          fail_on_unmatched_files: true
