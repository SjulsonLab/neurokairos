# NeuroKairos chrony client configuration.
# Mirrors raspberry_pi/scripts/install_chrony_client.sh — if you edit one,
# review the other.
#
# By default we sync to the public NTP pool. To sync to your own GPS-disciplined
# NTP server (a commercial appliance or a NeuroKairos server-variant Pi),
# uncomment and edit the `server` line below, then `sudo systemctl restart chrony`.

# server 192.0.2.10 iburst prefer

# Diverse public NTP sources (mirrors the ntp-calibrator daemon's default
# server set) so the system always has >=3 independent sources — both for
# chrony's own selection and for the calibrator logger's source-diversity check.
server time.apple.com iburst
server time.google.com iburst
server time.cloudflare.com iburst
server time.aws.amazon.com iburst
server time.windows.com iburst

# Public pool as additional fallback
pool pool.ntp.org iburst maxsources 2

# LAN NeuroKairos servers discovered over mDNS are dropped into this directory
# by nk_discover_ntp.py and loaded at runtime via `chronyc reload sources` — no
# chronyd restart, no clock step. They are kept out of this file so a reload
# never disturbs the public sources above.
sourcedir /etc/chrony/sources.d

# Record tracking logs
logdir /var/log/chrony
log tracking measurements statistics

# Step the clock on startup if offset is > 1 second (3 attempts)
makestep 1.0 3

# Hardware timestamping (if NIC supports it; silently ignored if not)
hwtimestamp *

# RTC drift file
driftfile /var/lib/chrony/chrony.drift
